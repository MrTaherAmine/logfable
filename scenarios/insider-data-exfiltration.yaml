schema_version: 1.0.0
version: 1.0.0
difficulty: intermediate
status: stable
authors:
- Taher Amine ELHOUARI
license: Apache-2.0
knowledge:
  attack_version: '19.2'
  d3fend_version: 1.5.0
variables: {}
noise:
  percentage: 95
  benign_lookalikes: true
impairments:
  max_clock_skew_seconds: 5
  max_ingestion_delay_seconds: 25
  missing_event_rate: 0.003
  duplicate_rate: 0.003
questions:
- Which identities and assets form the earliest correlated suspicious chain?
- Which telemetry sources provide the strongest causal evidence?
- Which benign lookalike could cause an overly broad detection to fire?
- What visibility gap would most change confidence in the investigation?
scoring:
  max_points: 100
  rubric:
  - criterion: timeline
    points: 25
  - criterion: entities
    points: 25
  - criterion: evidence
    points: 25
  - criterion: detection-and-gaps
    points: 25
references:
- https://attack.mitre.org/
- https://d3fend.mitre.org/
id: insider-data-exfiltration
title: Insider data staging and exfiltration
summary: A synthetic insider accesses unusual business data, stages it locally, and
  generates outbound transfer evidence mixed with legitimate bulk-data workflows.
tags:
- insider
- collection
- exfiltration
domains:
- enterprise
platforms:
- Windows
- SaaS
estimated_events: 700
duration: 5h
safety:
  synthetic_only: true
  no_execution: true
  reserved_indicators_only: true
environment:
  preset: mid-sized
telemetry:
- windows-security
- edr
- db-audit
- proxy
- dns
- object-storage
detections: []
ground_truth:
  answers:
  - Unusual access and staging precede the outbound transfer; backups provide a benign
    lookalike.
steps:
- id: access
  title: Unusual data access
  after: []
  delay_seconds:
  - 20
  - 120
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1530
    tactic: Collection
    rationale: Synthetic access records show unusual high-volume data retrieval.
    confidence: high
    detection_strategies: []
    analytics: []
    data_components: []
  d3fend:
  - d3fend_id: D3-UBA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Behavior analysis can compare access with job-function baselines.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: db-audit
    action: bulk-read
    category: database
    severity: 7
    message: Synthetic user reads unusually large business dataset
    fields: {}
  benign_lookalikes:
  - Authorized administration can resemble this behavior when scoped to expected assets.
  expected_detections:
  - Correlate identity, entity, source and time-window evidence across generated telemetry.
  instructor_notes: Synthetic evidence only; no operational intrusion commands are
    emitted.
- id: stage
  title: Local staging
  after:
  - access
  delay_seconds:
  - 20
  - 120
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1074.001
    tactic: Collection
    rationale: Synthetic file creation represents local staging without writing real
      sensitive content.
    confidence: high
    detection_strategies: []
    analytics: []
    data_components: []
  d3fend:
  - d3fend_id: D3-FA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: File analysis can identify abnormal staging patterns.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: edr
    action: archive-created
    category: file
    severity: 8
    message: Synthetic inert archive placeholder appears in telemetry
    fields: {}
  benign_lookalikes:
  - Authorized administration can resemble this behavior when scoped to expected assets.
  expected_detections:
  - Correlate identity, entity, source and time-window evidence across generated telemetry.
  instructor_notes: Synthetic evidence only; no operational intrusion commands are
    emitted.
- id: transfer
  title: Outbound transfer
  after:
  - stage
  delay_seconds:
  - 20
  - 120
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1041
    tactic: Exfiltration
    rationale: Synthetic outbound flow metadata represents exfiltration without transmitting
      data.
    confidence: high
    detection_strategies: []
    analytics: []
    data_components: []
  d3fend:
  - d3fend_id: D3-UDTA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: User data transfer analysis can identify atypical transfer volume.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  - d3fend_id: D3-NTA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Network traffic analysis can correlate destination and volume.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: proxy
    action: large-upload
    category: network
    severity: 9
    message: Synthetic large outbound transfer to archive.example
    fields: {}
  benign_lookalikes:
  - Authorized administration can resemble this behavior when scoped to expected assets.
  expected_detections:
  - Correlate identity, entity, source and time-window evidence across generated telemetry.
  instructor_notes: Synthetic evidence only; no operational intrusion commands are
    emitted.
