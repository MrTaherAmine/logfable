schema_version: 1.0.0
version: 1.0.0
difficulty: advanced
status: experimental
authors:
- Taher Amine ELHOUARI
license: Apache-2.0
knowledge:
  attack_version: '19.2'
  d3fend_version: 1.5.0
variables:
  test_seeds:
  - 2026
  - 2027
  - 314159
noise:
  percentage: 96
  benign_lookalikes: true
impairments:
  max_clock_skew_seconds: 8
  max_ingestion_delay_seconds: 45
  missing_event_rate: 0.004
  duplicate_rate: 0.004
questions:
- What is the earliest evidence that distinguishes the suspicious chain from normal
  activity?
- Which identity, host, session, and cloud/application events should be correlated?
- Which benign lookalike is most likely to trigger an overly broad detection?
- Which telemetry impairment or visibility gap most changes investigative confidence?
scoring:
  max_points: 100
  rubric:
  - criterion: timeline
    points: 25
  - criterion: identity-and-entities
    points: 25
  - criterion: evidence-and-correlation
    points: 25
  - criterion: detection-tuning-and-gaps
    points: 25
references:
- https://attack.mitre.org/
- https://d3fend.mitre.org/
safety:
  synthetic_only: true
  no_execution: true
  reserved_indicators_only: true
  payloads: inert-placeholders-only
id: privileged-credential-unusual-location
title: Privileged credentials used from an unusual location
summary: A privileged synthetic account is used from a new documentation-range geography,
  accesses administrative resources, and performs sensitive changes while approved
  break-glass and travel activity create false-positive pressure.
tags:
- identity
- privileged-access
- cloud
- vpn
domains:
- enterprise
platforms:
- Windows
- IaaS
- SaaS
estimated_events: 800
duration: 3h
environment:
  preset: hybrid-enterprise
telemetry:
- entra
- vpn
- active-directory
- cloud-control
- windows-security
detections:
- name: Privileged sign-in anomaly with downstream administration
  expected: true
ground_truth:
  answers:
  - The first strong signal is an unusual privileged sign-in that is followed by administrative
    access and sensitive control-plane changes.
steps:
- id: priv-signin
  title: Privileged sign-in from unusual location
  after: []
  delay_seconds:
  - 20
  - 180
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1078
    tactic: Initial Access
    rationale: A privileged valid account is used from an anomalous synthetic source.
    confidence: high
    detection_strategies: []
    analytics: []
    data_components: []
  d3fend:
  - d3fend_id: D3-UGLPA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Geolocation/logon analysis can distinguish anomalous privileged access
      from the normal baseline.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: entra
    action: privileged-sign-in
    category: authentication
    severity: 9
    message: Synthetic privileged sign-in from an unusual documentation-range location
    fields: {}
  - source: vpn
    action: privileged-session
    category: authentication
    severity: 8
    message: Synthetic privileged VPN session established from the same unusual source
    fields: {}
  benign_lookalikes:
  - A privileged administrator may legitimately connect while traveling or through
    an approved emergency path.
  expected_detections:
  - Require privileged role plus geolocation/device anomaly and subsequent sensitive
    activity.
  instructor_notes: Synthetic evidence only; no operational intrusion commands or
    live credentials are emitted.
- id: admin-access
  title: Administrative resource access
  after:
  - priv-signin
  delay_seconds:
  - 20
  - 180
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1078
    tactic: Privilege Escalation
    rationale: The same valid privileged identity accesses administrative resources.
    confidence: high
    detection_strategies: []
    analytics: []
    data_components: []
  d3fend:
  - d3fend_id: D3-ANAA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Administrative network activity analysis can identify unusual access
      paths.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: windows-security
    action: admin-logon
    category: authentication
    severity: 8
    message: Synthetic privileged logon to an administrative server
    fields: {}
  - source: active-directory
    action: directory-read
    category: authorization
    severity: 7
    message: Synthetic privileged directory access from the same session
    fields: {}
  benign_lookalikes:
  - Approved maintenance windows can produce concentrated privileged access.
  expected_detections:
  - Correlate privileged sign-in, VPN context, and administrative host access.
  instructor_notes: Synthetic evidence only; no operational intrusion commands or
    live credentials are emitted.
- id: sensitive-change
  title: Sensitive cloud configuration changed
  after:
  - admin-access
  delay_seconds:
  - 20
  - 180
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1098
    tactic: Persistence
    rationale: Synthetic account/permission manipulation changes persistent access
      state.
    confidence: high
    detection_strategies: []
    analytics: []
    data_components: []
  d3fend:
  - d3fend_id: D3-CCSA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Cloud configuration/state analysis can flag unexpected privilege or
      identity changes.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: cloud-control
    action: iam-change
    category: cloud
    severity: 9
    message: Synthetic privileged identity changes a sensitive cloud access policy
    fields: {}
  benign_lookalikes:
  - Planned IAM maintenance can legitimately change sensitive role assignments.
  expected_detections:
  - Alert when anomalous privileged sessions make identity or access-control changes.
  instructor_notes: Synthetic evidence only; no operational intrusion commands or
    live credentials are emitted.
