  synthetic_only: true
  no_execution: true
  reserved_indicators_only: true
  payloads: inert-placeholders-only
id: kubernetes-secret-workload-identity
title: Kubernetes secret access and workload identity misuse
summary: Kubernetes audit records show an unusual secret read, workload identity use, and cluster discovery
  while controllers and deployment automation create realistic high-volume lookalikes.
tags:
- kubernetes
- cloud
- identity
- container
domains:
- enterprise
platforms:
- Kubernetes
- Containers
- IaaS
estimated_events: 1000
duration: 4h
environment:
  preset: hybrid-enterprise
telemetry:
- kubernetes-audit
- container-runtime
- cloud-control
- oauth
- registry
detections:
- name: Cross-source correlation for kubernetes secret access and workload identity misuse
  expected: true
ground_truth:
  answers:
  - "The chain is secret resource read \u2192 workload identity use against cloud APIs \u2192 broad cluster\
    \ discovery, with controller and scanner lookalikes requiring service-account baselining."
steps:
- id: secret-read
  title: Unusual Kubernetes secret read
  after: []
  delay_seconds:
  - 20
  - 180
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1552.001
    tactic: Credential Access
    rationale: Kubernetes audit metadata represents access to a secret-bearing resource without revealing
      secret contents.
    confidence: high
    detection_strategies: []
    analytics: []
    data_components: []
  d3fend:
  - d3fend_id: D3-UBA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Behavior analysis can compare the service account resource-access pattern with its normal
      baseline.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: kubernetes-audit
    action: secret-get
    category: cloud
    severity: 8
    message: Synthetic Kubernetes audit records an unusual secret resource read.
    fields:
      namespace: payments-sim
      secret: INERT-SECRET-REF
  - source: container-runtime
    action: workload-context
    category: process
    severity: 5
    message: Synthetic runtime metadata identifies the workload context associated with the request.
    fields:
      image: registry.example/simulated/app:1
  benign_lookalikes:
  - Controllers, operators, and approved deployment jobs may legitimately read secrets.
  expected_detections:
  - Baseline secret reads by service account, namespace, workload, and deployment window.
  instructor_notes: Synthetic evidence only; no operational intrusion commands, credential material, executable
    payloads, or live malicious infrastructure are emitted.
- id: workload-identity-use
  title: Workload identity used outside normal pattern
  after:
  - secret-read
  delay_seconds:
  - 20
  - 180
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1550.001
    tactic: Defense Evasion
    rationale: Synthetic application-access-token use is represented through cloud and OAuth audit events
      only.
    confidence: high
    detection_strategies: []
    analytics: []
    data_components: []
  d3fend:
  - d3fend_id: D3-UBA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Behavior analysis can detect workload identity use outside expected resource and time patterns.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: oauth
    action: workload-token-use
    category: authentication
    severity: 8
    message: Synthetic workload identity token is used against a cloud API.
    fields:
      token: INERT-WORKLOAD-TOKEN
  - source: cloud-control
    action: workload-api-read
    category: cloud
    severity: 7
    message: Synthetic cloud control-plane read occurs under the same workload identity.
    fields:
      resource: storage.example/simulated
  benign_lookalikes:
  - Autoscaling jobs and deployment controllers may temporarily access cloud APIs with workload identities.
  expected_detections:
  - Correlate Kubernetes service account, pod identity, token audience, and cloud API target.
  instructor_notes: Synthetic evidence only; no operational intrusion commands, credential material, executable
    payloads, or live malicious infrastructure are emitted.
- id: cluster-discovery
  title: Cluster discovery activity
  after:
  - workload-identity-use
  delay_seconds:
  - 20
  - 180
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1613
    tactic: Discovery
    rationale: Synthetic audit events represent broad container and resource discovery.
    confidence: high
    detection_strategies: []
    analytics: []
    data_components: []
  d3fend:
  - d3fend_id: D3-ANAA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Administrative activity analysis can flag unusual breadth of cluster resource enumeration.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: kubernetes-audit
    action: resource-list
    category: cloud
    severity: 7
    message: Synthetic Kubernetes audit records broad namespace and workload listing.
    fields:
      scope: cluster
  - source: registry
    action: image-metadata-read
    category: cloud
    severity: 5
    message: Synthetic registry audit records related image metadata reads.
    fields:
      repository: simulated-app
  benign_lookalikes:
  - Cluster inventory tools and security scanners may legitimately enumerate many resources.
  expected_detections:
  - Detect a new service account performing cluster-wide discovery after atypical secret access.
  instructor_notes: Synthetic evidence only; no operational intrusion commands, credential material, executable
    payloads, or live malicious infrastructure are emitted.
