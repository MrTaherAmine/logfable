safety:
  synthetic_only: true
  no_execution: true
  reserved_indicators_only: true
  payloads: inert-placeholders-only
id: credential-stuffing-web-identity
title: Credential stuffing across WAF, application, and identity telemetry
summary: A synthetic public application receives many distinct username/password-pair attempts from one
  documentation-range source, followed by a successful identity session; no breached credentials are included.
tags:
- credential-stuffing
- waf
- identity
- web
domains:
- enterprise
platforms:
- SaaS
- Identity Provider
- Web
estimated_events: 1100
duration: 2h
environment:
  preset: hybrid-enterprise
telemetry:
- waf
- api-gateway
- app-auth
- idp
- entra
- proxy
detections:
- name: Cross-source correlation for credential stuffing across waf, application, and identity telemetry
  expected: true
ground_truth:
  answers:
  - The defining signal is many distinct identity failures from one source, one later success, and unusual
    post-authentication use; NAT-heavy benign traffic is an intentional trap.
steps:
- id: stuffing-burst
  title: Credential stuffing burst
  after: []
  delay_seconds:
  - 20
  - 180
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1110.004
    tactic: Credential Access
    rationale: Synthetic authentication failures across many identities represent credential stuffing;
      no password values are emitted.
    confidence: high
    detection_strategies:
    - DET0460
    analytics:
    - AN1265
    data_components:
    - DC0002
  d3fend:
  - d3fend_id: D3-CAA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Connection-attempt analysis can identify bursty authentication attempts across many user
      identities.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  - d3fend_id: D3-CCSA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Credential-compromise scope analysis can identify which synthetic accounts require review.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: waf
    action: login-attempt-burst
    category: web
    severity: 7
    message: Synthetic WAF metadata records a burst of login attempts across many identities.
    fields:
      usernames: 75
      credentials: NOT-PRESENT
  - source: app-auth
    action: login-failure-series
    category: authentication
    severity: 7
    message: Synthetic application audit records repeated failures across distinct users.
    fields:
      unique_users: 75
  - source: idp
    action: authentication-failure-series
    category: authentication
    severity: 7
    message: Synthetic IdP audit records corresponding failures.
    fields:
      unique_users: 75
  benign_lookalikes:
  - A corporate NAT, classroom lab, or password-reset campaign can create many failures from one egress
    address.
  expected_detections:
  - Group by source, distinct usernames, failure/success sequence, application, and time window.
  instructor_notes: Synthetic evidence only; no operational intrusion commands, credential material, executable
    payloads, or live malicious infrastructure are emitted.
- id: account-success
  title: One account authenticates successfully
  after:
  - stuffing-burst
  delay_seconds:
  - 20
  - 180
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1078
    tactic: Initial Access
    rationale: A valid synthetic account is represented as successfully authenticating after the stuffing
      burst.
    confidence: high
    detection_strategies: []
    analytics: []
    data_components: []
  d3fend:
  - d3fend_id: D3-UGLPA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Logon-pattern analysis can compare the successful authentication to the user normal location
      and device patterns.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: entra
    action: sign-in-success
    category: authentication
    severity: 9
    message: Synthetic identity audit records a successful sign-in for one targeted account.
    fields:
      risk: high
  - source: api-gateway
    action: authenticated-session-created
    category: web
    severity: 7
    message: Synthetic API gateway telemetry records a session for the same identity.
    fields:
      session: INERT-SESSION
  benign_lookalikes:
  - A legitimate user behind the same NAT may sign in after other users make mistakes.
  expected_detections:
  - Do not alert on source IP alone; correlate targeted identity, device, risk, and preceding failure
    pattern.
  instructor_notes: Synthetic evidence only; no operational intrusion commands, credential material, executable
    payloads, or live malicious infrastructure are emitted.
- id: post-auth-use
  title: Post-authentication application use
  after:
  - account-success
  delay_seconds:
  - 20
  - 180
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1078
    tactic: Defense Evasion
    rationale: The synthetic valid account continues to access application resources.
    confidence: high
    detection_strategies: []
    analytics: []
    data_components: []
  d3fend:
  - d3fend_id: D3-UBA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Behavior analysis can identify resource use inconsistent with the account baseline.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: proxy
    action: authenticated-api-access
    category: network
    severity: 6
    message: Synthetic proxy metadata records the new authenticated session accessing unusual resources.
    fields:
      destination: app.example
  - source: app-auth
    action: privileged-view
    category: authorization
    severity: 8
    message: Synthetic application audit records access to an unusually sensitive view.
    fields:
      resource: simulated-admin-view
  benign_lookalikes:
  - Support personnel may legitimately access sensitive views during approved troubleshooting.
  expected_detections:
  - Correlate successful sign-in to subsequent resource use and expected user role.
  instructor_notes: Synthetic evidence only; no operational intrusion commands, credential material, executable
    payloads, or live malicious infrastructure are emitted.
