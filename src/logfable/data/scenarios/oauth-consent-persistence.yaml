id: oauth-consent-persistence
title: OAuth consent abuse and cloud identity persistence
summary: A synthetic OAuth consent sequence creates durable application access without
  using real tokens or external applications.
tags:
- oauth
- cloud
- identity
domains:
- enterprise
platforms:
- Office 365
- SaaS
estimated_events: 650
duration: 3h
safety:
  synthetic_only: true
  no_execution: true
  reserved_indicators_only: true
environment:
  preset: cloud-native-saas
telemetry:
- entra
- oauth
- m365
- cloud-control
detections: []
ground_truth:
  answers:
  - Consent is followed by application-token use and role persistence.
steps:
- id: consent
  title: High-risk application consent
  after: []
  delay_seconds:
  - 20
  - 120
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1098
    tactic: Persistence
    rationale: Account/application permissions are modified to preserve access.
    confidence: high
    detection_strategies: []
    analytics: []
    data_components: []
  d3fend:
  - d3fend_id: D3-UBA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Analyze unusual authorization and consent behavior.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: oauth
    action: consent-granted
    category: authorization
    severity: 8
    message: Synthetic OAuth consent granted to fictitious application
    fields: {}
  benign_lookalikes:
  - Authorized administration can resemble this behavior when scoped to expected assets.
  expected_detections:
  - Correlate identity, entity, source and time-window evidence across generated telemetry.
  instructor_notes: Synthetic evidence only; no operational intrusion commands are
    emitted.
- id: token
  title: Application access token used
