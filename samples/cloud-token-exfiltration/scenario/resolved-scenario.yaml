schema_version: 1.0.0
id: cloud-token-exfiltration
version: 1.0.0
title: Cloud access-token theft and object-storage exfiltration
summary: A synthetic cloud identity session is followed by unusual object enumeration,
  staged access, and represented exfiltration to a .example destination.
difficulty: intermediate
status: stable
authors:
- Taher Amine ELHOUARI
license: Apache-2.0
tags:
- cloud
- token
- exfiltration
domains:
- enterprise
platforms:
- IaaS
estimated_events: 700
duration: 4h
safety:
  synthetic_only: true
  no_execution: true
  reserved_indicators_only: true
knowledge:
  attack_version: '19.2'
  d3fend_version: 1.5.0
environment:
  preset: cloud-native-saas
variables: {}
noise:
  percentage: 95
  benign_lookalikes: true
impairments:
  max_clock_skew_seconds: 5
  max_ingestion_delay_seconds: 25
  missing_event_rate: 0.003
  duplicate_rate: 0.003
steps:
- id: token
  title: Synthetic token use anomaly
  after: []
  delay_seconds:
  - 20
  - 120
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1528
    tactic: Credential Access
    detection_strategies: []
    analytics: []
    data_components: []
    rationale: A placeholder application access token is represented as stolen and
      used; no usable secret is generated.
    confidence: high
  d3fend:
  - d3fend_id: D3-CCSA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Scope credential exposure from authentication and access history.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: cloudtrail
    action: session-start
    category: authentication
    severity: 8
    message: Synthetic cloud session started with placeholder token reference
    fields: {}
  benign_lookalikes:
  - Authorized administration can resemble this behavior when scoped to expected assets.
  expected_detections:
  - Correlate identity, entity, source and time-window evidence across generated telemetry.
  instructor_notes: Synthetic evidence only; no operational intrusion commands are
    emitted.
- id: collect
  title: Cloud object collection
  after:
  - token
  delay_seconds:
  - 20
  - 120
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1530
    tactic: Collection
    detection_strategies: []
    analytics: []
    data_components: []
    rationale: Synthetic object-storage access records represent bulk collection.
    confidence: high
  d3fend:
  - d3fend_id: D3-UDTA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: User data transfer analysis can identify abnormal object access volume.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: object-storage
    action: object-read
    category: cloud
    severity: 8
    message: Synthetic bulk object read from storage container
    fields: {}
  benign_lookalikes:
  - Authorized administration can resemble this behavior when scoped to expected assets.
  expected_detections:
  - Correlate identity, entity, source and time-window evidence across generated telemetry.
  instructor_notes: Synthetic evidence only; no operational intrusion commands are
    emitted.
- id: exfil
  title: Represented exfiltration
  after:
  - collect
  delay_seconds:
  - 20
  - 120
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1567.002
    tactic: Exfiltration
    detection_strategies: []
    analytics: []
    data_components: []
    rationale: Synthetic transfer metadata represents exfiltration to storage at sink.example
      without sending data.
    confidence: high
  d3fend:
  - d3fend_id: D3-NTA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Network traffic analysis can correlate unusual outbound flows.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  - d3fend_id: D3-NTF
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Outbound filtering is a defensive opportunity, not a guarantee.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: proxy
    action: large-upload
    category: network
    severity: 9
    message: Synthetic large outbound upload to sink.example; no connection is made
    fields: {}
  - source: dns
    action: query
    category: dns
    severity: 5
    message: Synthetic DNS lookup for sink.example
    fields: {}
  benign_lookalikes:
  - Authorized administration can resemble this behavior when scoped to expected assets.
  expected_detections:
  - Correlate identity, entity, source and time-window evidence across generated telemetry.
  instructor_notes: Synthetic evidence only; no operational intrusion commands are
    emitted.
telemetry:
- cloudtrail
- azure-activity
- gcp-audit
- object-storage
- dns
- proxy
detections: []
ground_truth:
  answers:
  - Token-use anomalies precede object reads and staged transfer metadata.
questions:
- Which identities and assets form the earliest correlated suspicious chain?
- Which telemetry sources provide the strongest causal evidence?
- Which benign lookalike could cause an overly broad detection to fire?
- What visibility gap would most change confidence in the investigation?
scoring:
  max_points: 100
  rubric:
  - criterion: timeline
    points: 25
  - criterion: entities
    points: 25
  - criterion: evidence
    points: 25
  - criterion: detection-and-gaps
    points: 25
references:
- https://attack.mitre.org/
- https://d3fend.mitre.org/
