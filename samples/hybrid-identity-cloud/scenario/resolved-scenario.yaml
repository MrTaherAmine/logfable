schema_version: 1.0.0
id: hybrid-identity-cloud
version: 1.0.0
title: Hybrid identity attack moving from endpoint to cloud
summary: A synthetic endpoint credential event is correlated with remote administration,
  cloud sign-in, and privilege expansion in a hybrid environment.
difficulty: intermediate
status: stable
authors:
- Taher Amine ELHOUARI
license: Apache-2.0
tags:
- hybrid
- identity
- cloud
domains:
- enterprise
platforms:
- Windows
- IaaS
- Office 365
estimated_events: 750
duration: 5h
safety:
  synthetic_only: true
  no_execution: true
  reserved_indicators_only: true
knowledge:
  attack_version: '19.2'
  d3fend_version: 1.5.0
environment:
  preset: hybrid-enterprise
variables: {}
noise:
  percentage: 95
  benign_lookalikes: true
impairments:
  max_clock_skew_seconds: 5
  max_ingestion_delay_seconds: 25
  missing_event_rate: 0.003
  duplicate_rate: 0.003
steps:
- id: endpoint
  title: Endpoint credential exposure represented
  after: []
  delay_seconds:
  - 20
  - 120
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1552.001
    tactic: Credential Access
    detection_strategies: []
    analytics: []
    data_components: []
    rationale: Synthetic endpoint telemetry represents credential material exposure
      without including a secret.
    confidence: high
  d3fend:
  - d3fend_id: D3-SFA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: System file analysis can detect risky credential-bearing files or configuration
      changes.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: edr
    action: credential-file-access
    category: file
    severity: 8
    message: Synthetic access to inert credential placeholder
    fields: {}
  benign_lookalikes:
  - Authorized administration can resemble this behavior when scoped to expected assets.
  expected_detections:
  - Correlate identity, entity, source and time-window evidence across generated telemetry.
  instructor_notes: Synthetic evidence only; no operational intrusion commands are
    emitted.
- id: remote
  title: Remote administration
  after:
  - endpoint
  delay_seconds:
  - 20
  - 120
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1021.006
    tactic: Lateral Movement
    detection_strategies: []
    analytics: []
    data_components: []
    rationale: Synthetic WinRM-style session evidence represents remote administration
      without sending commands.
    confidence: high
  d3fend:
  - d3fend_id: D3-ANAA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Administrative network activity analysis can identify unexpected remote
      administration.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: windows-security
    action: remote-logon
    category: authentication
    severity: 8
    message: Synthetic remote management logon
    fields: {}
  - source: powershell
    action: remote-session
    category: process
    severity: 8
    message: Synthetic remote session metadata [NO COMMAND]
    fields: {}
  benign_lookalikes:
  - Authorized administration can resemble this behavior when scoped to expected assets.
  expected_detections:
  - Correlate identity, entity, source and time-window evidence across generated telemetry.
  instructor_notes: Synthetic evidence only; no operational intrusion commands are
    emitted.
- id: cloud
  title: Cloud privilege expansion
  after:
  - remote
  delay_seconds:
  - 20
  - 120
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1098.003
    tactic: Persistence
    detection_strategies: []
    analytics: []
    data_components: []
    rationale: Cloud role assignment is expanded after hybrid identity movement.
    confidence: high
  d3fend:
  - d3fend_id: D3-UBA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Analyze privilege assignment against normal administrative behavior.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: entra
    action: role-assignment
    category: authorization
    severity: 9
    message: Synthetic privileged cloud role added
    fields: {}
  - source: cloudtrail
    action: privileged-api
    category: cloud
    severity: 8
    message: Synthetic privileged cloud API audit event
    fields: {}
  benign_lookalikes:
  - Authorized administration can resemble this behavior when scoped to expected assets.
  expected_detections:
  - Correlate identity, entity, source and time-window evidence across generated telemetry.
  instructor_notes: Synthetic evidence only; no operational intrusion commands are
    emitted.
telemetry:
- windows-security
- sysmon
- active-directory
- entra
- cloudtrail
- powershell
- vpn
detections: []
ground_truth:
  answers:
  - Endpoint identity evidence precedes remote administration and cloud privilege
