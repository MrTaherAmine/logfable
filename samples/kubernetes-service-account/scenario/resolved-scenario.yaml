schema_version: 1.0.0
id: kubernetes-service-account
version: 1.0.0
title: Kubernetes service-account compromise and cluster discovery
summary: A synthetic Kubernetes service account is used outside its normal workload
  context and performs represented cluster discovery without issuing real API requests.
difficulty: intermediate
status: stable
authors:
- Taher Amine ELHOUARI
license: Apache-2.0
tags:
- kubernetes
- container
- identity
