- enterprise
platforms:
- Containers
estimated_events: 650
duration: 3h
safety:
  synthetic_only: true
  no_execution: true
  reserved_indicators_only: true
knowledge:
  attack_version: '19.2'
  d3fend_version: 1.5.0
environment:
  preset: cloud-native-saas
variables: {}
noise:
  percentage: 95
  benign_lookalikes: true
impairments:
  max_clock_skew_seconds: 5
  max_ingestion_delay_seconds: 25
  missing_event_rate: 0.003
  duplicate_rate: 0.003
steps:
- id: token
  title: Service-account credential represented as abused
  after: []
  delay_seconds:
  - 20
  - 120
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1552.001
    tactic: Credential Access
    detection_strategies: []
    analytics: []
    data_components: []
    rationale: Synthetic metadata represents service-account credential exposure without
      revealing a usable token.
    confidence: high
  d3fend:
  - d3fend_id: D3-CCSA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Credential compromise scope analysis can review where the identity
      was used.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
