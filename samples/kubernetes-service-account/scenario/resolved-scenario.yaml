    action: serviceaccount-auth
    category: authentication
    severity: 8
    message: Synthetic Kubernetes service-account authentication outside expected
      workload
    fields: {}
  benign_lookalikes:
  - Authorized administration can resemble this behavior when scoped to expected assets.
  expected_detections:
  - Correlate identity, entity, source and time-window evidence across generated telemetry.
  instructor_notes: Synthetic evidence only; no operational intrusion commands are
    emitted.
- id: discover
  title: Cluster resource discovery
  after:
  - token
  delay_seconds:
  - 20
  - 120
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T1613
    tactic: Discovery
    detection_strategies:
    - DET0490
    analytics:
    - AN1352
    data_components:
    - DC0037
    - DC0091
    rationale: Synthetic Kubernetes audit events represent pod and node enumeration.
    confidence: high
  d3fend:
  - d3fend_id: D3-UBA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Behavior analysis can compare service-account activity with workload
      baseline.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: kubernetes-audit
    action: list-pods
    category: discovery
    severity: 8
    message: Synthetic list request for pods; no API call is sent
    fields: {}
  - source: kubernetes-audit
    action: list-nodes
    category: discovery
    severity: 8
    message: Synthetic list request for nodes; no API call is sent
    fields: {}
  - source: container-runtime
    action: workload-context-observed
    category: discovery
    severity: 7
    message: Synthetic container runtime metadata shows the service identity outside
