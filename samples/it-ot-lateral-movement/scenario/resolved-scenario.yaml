schema_version: 1.0.0
id: it-ot-lateral-movement
version: 1.0.0
title: IT-to-OT lateral-movement investigation using passive synthetic evidence
summary: A metadata-only investigation models identity use across an IT jump host
  and OT remote-access gateway, followed by passive industrial-network observations.
  No control commands are generated.
difficulty: intermediate
status: stable
authors:
- Taher Amine ELHOUARI
license: Apache-2.0
tags:
- ot
- ics
- lateral-movement
domains:
- ics
- enterprise
platforms:
- Windows
- Network
estimated_events: 650
duration: 4h
safety:
  synthetic_only: true
  no_execution: true
  reserved_indicators_only: true
  ot_metadata_only: true
  no_control_commands: true
knowledge:
  attack_version: '19.2'
  d3fend_version: 1.5.0
environment:
  preset: segmented-it-ot
variables: {}
noise:
  percentage: 95
  benign_lookalikes: true
impairments:
  max_clock_skew_seconds: 5
  max_ingestion_delay_seconds: 25
  missing_event_rate: 0.003
  duplicate_rate: 0.003
steps:
- id: it-login
  title: IT jump-host identity use
  after: []
  delay_seconds:
  - 20
  - 120
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T0859
    tactic: ICS Initial Access / Persistence
    detection_strategies: []
    analytics: []
    data_components: []
    rationale: A valid identity is used in the ICS-related access chain.
    confidence: high
  d3fend:
  - d3fend_id: D3-UGLPA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Analyze unusual logon patterns for privileged remote-access identities.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: windows-security
    action: remote-logon
    category: authentication
    severity: 8
    message: Synthetic jump-host logon recorded
    fields: {}
  benign_lookalikes:
  - Authorized administration can resemble this behavior when scoped to expected assets.
  expected_detections:
  - Correlate identity, entity, source and time-window evidence across generated telemetry.
  instructor_notes: Synthetic evidence only; no operational intrusion commands are
    emitted.
- id: gateway
  title: OT remote-access gateway session
  after:
  - it-login
  delay_seconds:
  - 20
  - 120
  probability: 1.0
  actor: attacker
  target: primary-user
  state_changes: {}
  attack:
  - technique_id: T0886
    tactic: ICS Lateral Movement
    detection_strategies: []
    analytics: []
    data_components: []
    rationale: Synthetic gateway session represents remote services without issuing
      control commands.
    confidence: high
  d3fend:
  - d3fend_id: D3-ANAA
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Administrative network activity analysis can highlight unexpected remote
      access.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  - d3fend_id: D3-NTF
    relationship: defensive-opportunity
    mapping_type: project-curated
    rationale: Segmentation filtering is a containment opportunity, not guaranteed
      prevention.
    confidence: medium
    source_url: https://d3fend.mitre.org/
    review_status: reviewed
  evidence:
  - source: ot-remote
    action: session-established
    category: network
    severity: 9
    message: Synthetic OT remote-access gateway session
    fields: {}
  - source: ot-firewall
    action: zone-transition
    category: network
    severity: 9
