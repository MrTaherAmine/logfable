[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logfable"
version = "1.0.0"
description = "Local-first scenario-as-code engine for deterministic synthetic cybersecurity telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Taher Amine ELHOUARI"}]
maintainers = [{name = "Taher Amine ELHOUARI"}]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.15,<1",
  "rich>=13,<16",
  "PyYAML>=6.0,<7",
]
keywords = ["cybersecurity", "synthetic-telemetry", "detection-engineering", "soc", "mitre-attack", "d3fend"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "hypothesis>=6,<7",
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
  "build>=1.2,<2",
  "twine>=6,<7",
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
  "types-PyYAML>=6.0.12.20250822",
]
parquet = ["pyarrow>=18,<23"]

[project.scripts]
logfable = "logfable.cli:app"

[project.entry-points."logfable.plugins"]
# third-party plugins register here

[project.urls]
Homepage = "https://www.taheramine.org"
Repository = "https://github.com/MrTaherAmine/logfable"
Issues = "https://github.com/MrTaherAmine/logfable/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
logfable = ["data/**/*.json", "data/**/*.yaml", "data/**/*.yml", "data/**/*.md"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["logfable"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/logfable/report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

